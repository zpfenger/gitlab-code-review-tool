<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - GitLab 代码审查工具</title>
    <link rel="stylesheet" href="https://renruiplugins.oss-cn-beijing.aliyuncs.com/static/plugins/font-awesome/css/font-awesome.min.css?">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/static/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <style>
        body, button, input, select, textarea {
            font: 12px "微软雅黑";
        }

        .login-orange-ui {
            background-color: transparent;
        }

        .login-orange-ui .login-top {
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
            position: relative;
            z-index: 1;
        }

        .login-orange-ui .login-top .bg {
            overflow: hidden;
            width: 1200px;
            margin: 0 auto;
            height: 100px;
        }

        .login-orange-ui .login-top .left {
            float: left;
            padding-top: 26px;
        }

        .login-orange-ui .login-top .right {
            float: right;
            padding: 42px 0 0 0;
        }

        .login-orange-ui .login-input {
            position: relative;
            width: 100%;
            overflow: hidden;
            height: 540px;
            background-color: #f6f6f6;
        }

        .login-orange-ui .login-input .bg {
            position: absolute;
            top: 0;
            left: 50%;
            margin-left: -960px;
        }

        .login-orange-ui .login-input .right-bottom {
            position: absolute;
            top: 440px;
            left: 50%;
            margin-left: 210px;
            width: 370px;
            text-align: center;
            color: #fff;
            line-height: 21px;
        }

        .login-orange-ui .login-edit {
            background-color: #fff;
            width: 370px;
            height: 320px;
            position: absolute;
            top: 100px;
            left: 50%;
            margin-left: 210px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            border-radius: 5px;

            .login-err {
                color: red;
                text-align: center;
                padding-top: 10px;
                display: none;
            }
            .login-err.show {
                display: block;
            }
        }

        .login-orange-ui .login-edit h3 {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #eee;
            line-height: 65px;
            padding-top: 10px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .login-orange-ui .login-edit ul {
            padding: 10px 25px;
        }

        .login-orange-ui .login-edit li {
            padding-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .login-orange-ui .login-edit li:first-child {
            margin-top: -10px;
        }

        .login-orange-ui .login-edit li i {
            position: absolute;
            top: 32px;
            left: 12px;
            color: #e6e6e6;
            font-size: 19px;
        }

        .login-orange-ui .login-edit li span {
            color: #ee5a2f;
            margin-top: 2px;
            display: inline-block;
        }

        .login-orange-ui .login-edit ul li a:hover {
            color: #ee5a2f;
        }

        .login-orange-ui .login-edit li .unified-left {
            float: left;
        }

        .login-orange-ui .login-edit li .unified-left label {
            position: relative;
            padding-left: 17px;
            cursor: pointer;
        }

        .login-orange-ui .login-edit li .unified-left label input {
            position: absolute;
            top: 2px;
            left: 0;
        }

        .login-orange-ui .login-edit li .unified-right {
            float: right;
        }

        .login-orange-ui .login-edit li {
            .unified-input {
                width: 100%;
                border: 1px solid #e6e6e6;
                height: 40px;
                font-size: 14px;
                padding-left: 40px;
                border-radius: 5px;
            }

            .unified-input::placeholder {
                color: #ccc;
            }
        }

        .login-orange-ui .login-edit li .unified-button {
            width: 100%;
            border: none;
            height: 40px;
            background-color: #ee5a2f;
            color: #fff;
            font-size: 14px;
            border-radius: 5px;

            i.bi{
                display: none;
            }
        }

        .login-orange-ui .login-record {
            text-align: center;
            line-height: 24px;
            padding: 38px 0;
            font-size: 12px;
        }

        .login-edit .switch {
            position: absolute;
            top: 0;
            right: 0;
            width: 40px;
            height: 40px;
            /*background: url("/images/auth/login-sprite.png") no-repeat;*/
            cursor: pointer;
        }

        .login-edit .active {
            background-position: -40px -40px;
        }

        .login-edit .code {
            text-align: center;
            display: none;
            padding-top: 15px;
        }

        .login-edit .code img {
            width: 230px;
        }

        .login-errors {
            color: #ee5a2f;
            font-size: 13px;
            text-align: center;
            margin-bottom: 5px;
        }

        @media (max-width: 1100px) {
            .login-orange-ui {
                background-color: #f8f8f8;
            }

            .login-orange-ui .login-top {
                padding-top: 0 !important;
                box-shadow: none;
            }

            .login-orange-ui .login-top .bg {
                width: auto;
            }

            .login-orange-ui .login-top .left {
                width: 100%;
                text-align: center;
            }

            .login-orange-ui .login-input .bg,
            .login-orange-ui .login-top .right {
                display: none;
            }

            .login-orange-ui .login-input {
                height: auto;
                background-color: #fff;
                border-top: 1px solid #eee;
                border-bottom: 1px solid #eee;
                padding-bottom: 20px;
            }

            .login-orange-ui .login-edit {
                position: relative;
                top: 0;
                left: 0;
                margin: 0;
                width: auto;
                height: auto;
                box-shadow: none;
            }

            .login-orange-ui .login-record {
                color: #ccc;
            }
        }
    </style>
</head>
<body>
<div class="login-orange-ui">
    <div class="login-top">
        <div class="bg">
            <div class="left"><img src="/static/images/login/login-logo-white.svg" style="height: 45px;"></div>
            <div class="right"><img src="/static/images/login/title.svg" height="30" alt=""></div>
        </div>
    </div>
    <!-- 右侧登录卡片 -->
    <div class="login-input">
        <!--banner-->
        <div class="bg"><img src="/static/images/login/banner-login2026h1.jpg" alt=""></div>
        <!--登录区-->
        <div class="login-edit">
            <form method="post" id="loginForm" action="/login" novalidate="novalidate">
                <h3>项目审查</h3>
                <div class="login-err" id="loginError"></div>
                <ul>
                    <!--错误消息-->
                    <li>
                        <i class="fa fa-user-circle-o"></i>
                        <input class="unified-input" type="text" id="username" name="username" placeholder="请输入用户名" required autofocus autocomplete="username" title="">
                    </li>
                    <li>
                        <i class="fa fa-key"></i>
                        <input class="unified-input" type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password" title="">
                    </li>
                    <li>
                        <button type="submit" class="unified-button" id="btnLogin">立即登录</button>
                    </li>
                </ul>
            </form>
        </div>
        <div class="right-bottom">浏览器 <b>推荐使用</b><br>谷歌(Chrome)、Microsoft(Edge)、360(极速模式)！</div>
    </div>
    <div class="login-record">
        上海人瑞网络科技有限公司<span style="padding: 0 10px;">版权所有©</span>沪公网安备 31010602003046号
    </div>
</div>

<script src="https://renruiplugins.oss-cn-beijing.aliyuncs.com/static/plugins/jquery/jquery.min.js?"></script>
<script>
    $(function () {
        if($(window).height()>740){
            $(".login-top").css("padding-top",($(window).height()-740)/2);
        }
    })
</script>

<script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnLogin');
        const errBox = document.getElementById('loginError');
        const username = document.getElementById('username');
        const password = document.getElementById('password');

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" style="width:15px;height:15px;border-width:2px;vertical-align:middle;"></span> 登录中...';
        errBox.classList.remove('show');
        errBox.innerHTML = '';

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: username.value.trim(),
                    password: password.value
                })
            });
            const result = await response.json();
            if (result.success) {
                window.location.href = '/';
            } else {
                errBox.innerHTML = '<i class="bi bi-exclamation-circle"></i>' + (result.message || '用户名或密码错误');
                errBox.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> 立即登录';
            }
        } catch (err) {
            errBox.innerHTML = '<i class="bi bi-wifi-off"></i> 网络异常，请稍后重试';
            errBox.classList.add('show');
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> 立即登录';
        }
    });
</script>
</body>
</html>
